name: MDLovFi Android APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MDLovFi release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify pinned Flutter submodule
        env:
          FLUTTER_COMMIT: 4cf269e36de2573851eaef3c763994f8f9be494d
        run: |
          test "$(git -C flutter rev-parse HEAD)" = "$FLUTTER_COMMIT"
          git -C flutter show -s --format='%H %s' HEAD

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Generate localization
        run: dart localization/generator.dart

      - name: Verify Android MainActivity package
        shell: bash
        run: |
          test -f android/app/src/main/kotlin/com/merrmist/mdlovfimusic/MainActivity.kt
          grep -Fx 'package com.merrmist.mdlovfimusic' android/app/src/main/kotlin/com/merrmist/mdlovfimusic/MainActivity.kt
          grep -F 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos lib test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          echo "APK: build/app/outputs/flutter-apk/app-release.apk"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload MDLovFi APK
        uses: actions/upload-artifact@v4
        with:
          name: mdlovfi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
