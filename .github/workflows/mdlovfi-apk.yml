name: MDLovFi Android APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MDLovFi release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Flutter SDK
        env:
          FLUTTER_COMMIT: 4cf269e36de2573851eaef3c763994f8f9be494d
        run: |
          git -C flutter fetch --tags --force origin
          git -C flutter checkout -B stable "$FLUTTER_COMMIT"
          test "$(git -C flutter rev-parse HEAD)" = "$FLUTTER_COMMIT"
          ./flutter/bin/flutter --version
          ./flutter/bin/flutter precache --android
      - name: Generate localization
        run: ./flutter/bin/dart localization/generator.dart

      - name: Get dependencies
        run: ./flutter/bin/flutter pub get

      - name: Analyze
        run: ./flutter/bin/flutter analyze --no-fatal-infos lib test

      - name: Build release APK
        run: ./flutter/bin/flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          echo "APK: build/app/outputs/flutter-apk/app-release.apk"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload MDLovFi APK
        uses: actions/upload-artifact@v4
        with:
          name: mdlovfi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
