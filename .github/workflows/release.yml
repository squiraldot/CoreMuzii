name: Release Workflow

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          
      - name: Generate Localization
        run: dart localization/generator.dart
        
      - name: Set update check flag
        run: echo "const updateCheckFlag = true;" > lib/utils/update_check_flag_file.dart
        
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build Universal APK
        run: flutter build apk --release
        
      - name: Build Architecture Specific APKs
        run: flutter build apk --target-platform android-arm,android-arm64 --split-per-abi --release
        
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: build/app/outputs/flutter-apk/*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
      
      - name: Organize Android APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "$GITHUB_REF_NAME" != v* ]]; then VERSION="latest"; fi
          find . -path './release-assets' -prune -o -name "*.apk" -type f -exec cp {} release-assets/ \;
          cd release-assets
          if [ -f "app-armeabi-v7a-release.apk" ]; then mv app-armeabi-v7a-release.apk "mdlovfimusic-${VERSION}-armeabi-v7a.apk"; fi
          if [ -f "app-arm64-v8a-release.apk" ]; then mv app-arm64-v8a-release.apk "mdlovfimusic-${VERSION}-arm64-v8a.apk"; fi
          if [ -f "app-release.apk" ]; then mv app-release.apk "mdlovfimusic-${VERSION}.apk"; fi
          test -n "$(find . -maxdepth 1 -name '*.apk' -print -quit)"
          sha256sum *.apk > "mdlovfimusic-v${VERSION}.sha256sum"
          
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          body_path: release-notes.md
          generate_release_notes: true
