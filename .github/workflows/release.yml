name: Release Workflow

on:
  push:
    branches:
      - feature/advanced-equalizer
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'

      - name: Generate Localization
        run: dart localization/generator.dart

      - name: Set update check flag
        run: echo "const updateCheckFlag = true;" > lib/utils/update_check_flag_file.dart

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Architecture Specific APKs
        run: flutter build apk --target-platform android-arm,android-arm64,android-x64 --split-per-abi --release

      - name: Verify generated APKs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  package-android:
    name: Package and verify Android release assets
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: downloaded-apks

      - name: Organize APKs and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then VERSION="latest"; fi
          find downloaded-apks -type f -name "*.apk" -exec cp {} release-assets/ \;
          cd release-assets
          if [ -f "app-armeabi-v7a-release.apk" ]; then mv app-armeabi-v7a-release.apk "mdlovfimusic-${VERSION}-armeabi-v7a.apk"; fi
          if [ -f "app-arm64-v8a-release.apk" ]; then mv app-arm64-v8a-release.apk "mdlovfimusic-${VERSION}-arm64-v8a.apk"; fi
          if [ -f "app-x86_64-release.apk" ]; then mv app-x86_64-release.apk "mdlovfimusic-${VERSION}-x86_64.apk"; fi
          if [ -f "app-release.apk" ]; then mv app-release.apk "mdlovfimusic-${VERSION}.apk"; fi
          test -s "mdlovfimusic-${VERSION}.apk"
          test -s "mdlovfimusic-${VERSION}-armeabi-v7a.apk"
          test -s "mdlovfimusic-${VERSION}-arm64-v8a.apk"
          test -s "mdlovfimusic-${VERSION}-x86_64.apk"
          sha256sum *.apk > "mdlovfimusic-v${VERSION}.sha256sum"
          sha256sum -c "mdlovfimusic-v${VERSION}.sha256sum"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: release-assets/*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [package-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -n "$(find . -maxdepth 1 -name '*.apk' -type f -print -quit)"
          checksum_file="$(find . -maxdepth 1 -name '*.sha256sum' -type f -print -quit)"
          test -n "$checksum_file"
          sha256sum -c "$checksum_file"

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          body_path: release-notes.md
          generate_release_notes: true
